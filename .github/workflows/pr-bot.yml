name: codeloom-pr-bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so merge-base with the base branch exists

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve merge base
        id: base
        run: |
          MB=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || echo HEAD~1)
          echo "revspec=${MB}..HEAD" >> "$GITHUB_OUTPUT"

      - name: Assemble review comment
        id: assemble
        run: |
          python3 scripts/pr_bot.py "${{ steps.base.outputs.revspec }}" \
            "${{ github.event.pull_request.title }}" > /tmp/comment.md
          echo "bytes=$(wc -c < /tmp/comment.md)" >> "$GITHUB_OUTPUT"

      - name: Post / update sticky comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- codeloom-pr-bot:v1 -->';
            let body = fs.readFileSync('/tmp/comment.md', 'utf8');
            const cap = 60000;
            if (body.length > cap) body = body.slice(0, cap) + '\n… (truncated)';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const mine = comments.find(c => c.body && c.body.includes(MARKER));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body,
              });
              console.log(`updated existing comment ${mine.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('created new review comment');
            }

      - name: Apply risk-band label
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/comment.md', 'utf8');
            // band line looks like: "score 77/100 [critical]" or "[low]"
            const m = body.match(/score \d+\/100 \[(\w+)\]/);
            if (!m) { console.log('no score found — skipping label'); return; }
            const band = m[1];                       // low | medium | high | critical
            const label = `risk:${band}`;
            const wanted = ['risk:low','risk:medium','risk:high','risk:critical'];
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const l of labels) {
              if (wanted.includes(l.name) && l.name !== label) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, name: l.name,
                }).catch(() => {});
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels: [label],
            }).catch(e => console.log('label add failed (needs repo labels?):', e.message));
            console.log('applied', label);
