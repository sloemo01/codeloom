name: codeloom-pr-bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so merge-base with the base branch exists

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve merge base
        id: base
        run: |
          MB=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || echo HEAD~1)
          echo "revspec=${MB}..HEAD" >> "$GITHUB_OUTPUT"

      - name: Assemble summary comment (markdown)
        run: |
          python3 scripts/pr_bot.py "${{ steps.base.outputs.revspec }}" \
            "${{ github.event.pull_request.title }}" > /tmp/comment.md

      - name: Collect line-pinned findings (json)
        run: |
          python3 scripts/pr_bot.py "${{ steps.base.outputs.revspec }}" \
            --format json > /tmp/findings.json

      - name: Post inline review comments on exact diff lines
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let findings = [];
            try { findings = JSON.parse(fs.readFileSync('/tmp/findings.json', 'utf8')); }
            catch (e) { console.log('no findings json:', e.message); }

            if (findings.length === 0) {
              console.log('no inline findings — skipping review');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // NOTE: a token that owns the PR cannot use REQUEST_CHANGES
            // ("Can not request changes on your own pull request"), and GITHUB_TOKEN
            // acts as the repo owner — so always COMMENT.
            const comments = findings.slice(0, 30).map(f => ({
              path: f.path,
              side: 'RIGHT',
              line: f.line,
              body: `**${f.severity}** ${f.kind}\n\n${f.message}\n\n<sub>codeloom-pr-bot · deterministic · react 👍 if useful</sub>`,
            }));
            const event = 'COMMENT';

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_id: pr.head.sha,
                event,
                body: 'codeloom deterministic review',
                comments,
              });
              console.log(`posted ${comments.length} inline comment(s), event=${event}`);
            } catch (e) {
              // stale-line errors happen when the PR moved; fall back silently —
              // the sticky comment still carries everything.
              console.log('inline review failed (lines may have moved):', e.message);
            }

      - name: Post / update sticky summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- codeloom-pr-bot:v2 -->';
            let body = fs.readFileSync('/tmp/comment.md', 'utf8');
            const cap = 60000;
            if (body.length > cap) body = body.slice(0, cap) + '\n… (truncated)';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const mine = comments.find(c => c.body && c.body.includes(MARKER));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body,
              });
              console.log(`updated existing summary ${mine.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
              console.log('created new summary comment');
            }

      - name: Apply risk-band label
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/comment.md', 'utf8');
            const m = body.match(/score \d+\/100 \[(\w+)\]/);
            if (!m) { console.log('no score found — skipping label'); return; }
            const label = `risk:${m[1]}`;
            const wanted = ['risk:low','risk:medium','risk:high','risk:critical'];
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const l of labels) {
              if (wanted.includes(l.name) && l.name !== label) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, name: l.name,
                }).catch(() => {});
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels: [label],
            }).catch(e => console.log('label add failed (needs repo labels?):', e.message));
            console.log('applied', label);
