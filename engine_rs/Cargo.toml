[package]
name = "codeloom_engine"
version = "0.1.0"
edition = "2021"
description = "codeloom tree-sitter engine — real AST parsing for 8 major languages (optional Rust engine)"

[dependencies]
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
