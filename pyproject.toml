[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeloom"
version = "0.61.0"
description = "Give your AI coding agent a map of the repo in one second. Single-file, zero-dependency, no daemon, 100% local."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "sloemo01" }]
keywords = ["ai-agents", "codebase", "mcp", "code-intelligence", "token-savings",
            "code-graph", "call-graph", "claude-code", "cursor", "codex",
            "context-engineering", "llm-tooling", "repository-memory",
            "semantic-search", "tree-sitter", "codebase-memory", "codegraph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
codeloom = "codeloom:main"
codeloom-mcp = "codeloom_mcp:main"

[tool.setuptools]
py-modules = ["codeloom", "codeloom_mcp"]

[tool.setuptools.data-files]
"codeloom" = ["codeloom-mcp.py"]
